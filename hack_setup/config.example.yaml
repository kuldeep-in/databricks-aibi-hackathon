# Hackathon configuration: copy this file to config.yaml (in this hack_setup/ folder) and fill it in.
# config.yaml is listed in .gitignore, so your real values are never committed to the repo.

catalog: <your_catalog>            # the one catalog for the whole hackathon
warehouse_id: <warehouse_id>       # SQL warehouse attendees use for dashboards, Genie and the app
source_schema: hack_14oct          # read-only source data that attendees copy from

# One entry per attendee (add yourself too, to get a test schema).
# Each attendee gets their own schema named after their NAME (Jane Doe -> jane_doe), owns it, and gets
# USE CATALOG, read access to the source schema, and CAN USE on the warehouse (granted to their EMAIL).
attendees:
  - name: Jane Doe
    email: jane.doe@example.com
  - name: John Smith
    email: john.smith@example.com
